name: YouTube Radar Collector

on:
  schedule:
    # GitHub uses UTC. This runs approximately every 5 minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-radar-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect YouTube data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python main.py

      - name: Save snapshots back to repository
        run: |
          git config user.name "youtube-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots.json
          git diff --cached --quiet || git commit -m "Update YouTube Radar snapshots"
          git push
